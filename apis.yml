aid: eve
name: Eve
description: Eve (branded EveOS) is an AI operating system purpose-built for plaintiff
  and personal-injury law firms, founded in 2023 and headquartered in San Mateo, California.
  The platform works alongside attorneys across the entire case lifecycle - intake and
  lead qualification, document and medical-record review, medical chronology generation,
  case and risk analysis, damages calculation, and case management - bringing every case,
  attorney, and dollar into one place. Eve integrates with practice-management systems
  such as Clio, is SOC 2 Type 2 certified and HIPAA compliant, and is backed by Andreessen
  Horowitz (a16z), Lightspeed Venture Partners, and Menlo Ventures. Eve is a closed SaaS
  product and does not currently publish a public developer API, SDK, or developer portal.
